   </g>
   <g id="text_19">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(346.449403 65.604647)">time mean → 64-d</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(353.606419 72.898817)">Linear 64 → 2</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(344.706138 80.227681)">P(seizure | window)</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="468.9792" y="55.187644" transform="rotate(-0 468.9792 55.187644)">Clip score</text>
   </g>
   <g id="text_21">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(436.088286 65.604647)">geometric mean over</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(441.139848 72.898817)">the clip's windows</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(446.874325 80.192987)">→ P_E(seizure)</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #6b7079" transform="translate(4.752 140.178262)">Receptive field 373 samples (≈3 s) inside each 6 s window. Loss: class-weighted CE on window labels (ictal if ≥80% of the window lies in the annotated seizure).</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #6b7079" transform="translate(4.752 147.808762)">EEG detects seizures well (macro-F1 ≈0.98) but ranks severity at chance within a session, so the model is trained for seizure vs non-seizure only.</text>
   </g>
