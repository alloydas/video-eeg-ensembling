   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="99.36" y="55.187644" transform="rotate(-0 99.36 55.187644)">Windows</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(69.522898 65.604647)">resample to 125 Hz</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(67.589484 72.898817)">6 s windows, 3 s hop</text>
