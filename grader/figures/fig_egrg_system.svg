   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d2027" x="4.752" y="12.422719" transform="rotate(-0 4.752 12.422719)">EEG-Gated Racine Grader: EEG and video decide seizure vs non-seizure; video alone grades severity</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="30.672" y="46.547644" transform="rotate(-0 30.672 46.547644)">Video</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="30.672" y="56.964647" transform="rotate(-0 30.672 56.964647)">15 fps clip</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="101.952" y="46.547644" transform="rotate(-0 101.952 46.547644)">Video grader</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(73.684219 56.964647)">X3D-M with 3- and</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(81.166727 64.258817)">5-class heads</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="218.592" y="47.0222" transform="rotate(-0 218.592 47.0222)">P_V(grade | seizure), renormalised</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="218.592" y="75.0018" transform="rotate(-0 218.592 75.0018)">P_V(seizure) = 1 − P_V(non-seizure)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="30.672" y="129.491644" transform="rotate(-0 30.672 129.491644)">EEG</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(15.693164 139.908647)">1 channel</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(22.1015 147.202817)">1 kHz</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="101.952" y="129.491644" transform="rotate(-0 101.952 129.491644)">EEG detector</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(69.211906 139.680694)">TCN over 6 s windows,</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(66.341359 146.616134)">geometric-mean pooling</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="218.592" y="143.949" transform="rotate(-0 218.592 143.949)">P_E(seizure)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="352.08" y="90.611644" transform="rotate(-0 352.08 90.611644)">Gate, 3 parameters</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(319.067086 101.028647)">q = σ(a · logit P_V(sz)</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(316.856789 108.492473)"> + b · logit P_E(sz) + c)</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(352.08 115.9563)"/>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(315.325594 123.25047)">logistic regression fitted</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(318.354625 130.544641)">leave-one-animal-out;</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(312.645406 137.838811)">refit for each video model</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d2027" x="468.72" y="64.691644" transform="rotate(-0 468.72 64.691644)">Output</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(433.894242 75.108647)">P(non-seizure) = 1 − q</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(427.462078 82.437511)">P(grade g) = q · P_V(g | sz)</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(468.72 89.901337)"/>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(439.557234 97.195508)">g ∈ {mild, severe}</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(439.42618 104.489678)">or {S2, S3, S4, S5}</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(468.72 111.783848)"/>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d2027" transform="translate(442.499531 119.078019)">decision: argmax</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #6b7079" x="411.696" y="113.289787" transform="rotate(-0 411.696 113.289787)">q</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #6b7079" x="359.856" y="28.4832" transform="rotate(-0 359.856 28.4832)">grade split comes from video only</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #6b7079" transform="translate(4.752 185.451862)">The EEG network is interchangeable inside the gate (GRU, TCN and a small CPU-trained TCN agree within 0.002 macro-F1). The gain comes from EEG's independent</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #6b7079" transform="translate(4.752 193.082362)">seizure evidence (EEG and video detection errors overlap on 14 clips against 2.4 expected by chance) and from calibrating the two probabilities.</text>
   </g>
  </g>
 </g>
