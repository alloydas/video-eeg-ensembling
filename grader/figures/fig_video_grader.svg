   <g id="text_21">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #6b7079" transform="translate(4.752 140.178262)">Each res stage stacks X3D blocks (1×1×1 expand → 3×3×3 depthwise → squeeze-excite → 1×1×1 project, residual); time stays at 16 frames.</text>
